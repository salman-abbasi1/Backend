<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Weather App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container mt-5">
    <div class="card p-4 shadow-sm">
      <h4 class="mb-3">Weather Info</h4>
      
      <label for="city" class="form-label">Enter City Name</label>
      <input type="text" id="city" class="form-control" placeholder="Enter City Name">

      <button class="btn btn-primary mt-3" onclick="getWeather()">Get Weather</button>

      <p class="mt-3" id="result"></p>
    </div>
  </div>

  <script src="task.js"></script>
</body>
</html>
